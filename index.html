<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oparanno Trading – Price List</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f4;--card:#fff;--text:#1d2420;--muted:#6b7570;--line:#e2e6e0;--accent:#1f7a4d;--accent-t:#fff;--bad:#b3392f;--soft:#eef4f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f1a;--card:#14141f;--text:#f1f2f6;--muted:#9a9cab;--line:#2a2a38;--accent:#4cc489;--accent-t:#0c1a12;--bad:#ff8a8a;--soft:#191927}}
:root[data-theme="dark"]{--bg:#0f0f1a;--card:#14141f;--text:#f1f2f6;--muted:#9a9cab;--line:#2a2a38;--accent:#4cc489;--accent-t:#0c1a12;--bad:#ff8a8a;--soft:#191927}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:960px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column}
h1{font-size:1.5rem;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.25rem}
.stat span{color:var(--muted);font-size:.8rem}
.fh{font-weight:600;margin:0 0 10px}
.addtoggle{order:1;margin:0 0 12px;background:transparent;color:var(--accent);border:1px dashed var(--accent)}
#addcard{order:2}
#listcard{order:3}
.stats{order:4}
#status{order:5;margin:0 0 12px}
.card[hidden]{display:none}
form.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],input[type=number],input:not([type]){width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:0}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--accent);color:var(--accent-t);font-weight:600}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500;padding:8px 12px}
.live{font-size:.8rem;margin:10px 0 0;color:var(--muted)}
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;background:var(--bg);padding:8px 0 12px;margin-bottom:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.searchbar #q{width:100%;flex:1;padding:12px 14px;font-size:1rem}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}

/* --- Compact Row Layout --- */
.row{display:flex;flex-direction:column;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row.sim{background:var(--soft)}
.row-bottom{display:flex;align-items:center;justify-content:space-between;width:100%}
.thb{padding:0;border-radius:6px;background:var(--bg);border:1px solid var(--line);width:38px;height:38px;flex:none;overflow:hidden;line-height:0}
.thb img{width:100%;height:100%;object-fit:cover;display:block}
.main{flex:1;min-width:0}
.simlbl{display:block;font-size:.68rem;color:var(--muted);margin-bottom:1px}
.nm{font-weight:600;font-size:.92rem;line-height:1.2;overflow-wrap:anywhere}
.chip{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--line);border-radius:6px;font-size:.7rem;color:var(--muted)}
.vals{display:flex;align-items:center;gap:4px;font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text)}
.vals i{font-style:normal;font-size:.72rem;color:var(--muted);margin-right:2px}

.editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;background:var(--soft);border-left:3px solid var(--accent);padding:12px}
.editor .eh{grid-column:1/-1;font-weight:600}
.editor .full{grid-column:1/-1}
.editor .eb{display:flex;gap:8px}
.pr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pr img,.pp img{width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.pick{display:inline-block;margin:0;padding:6px 10px;border:1px dashed var(--accent);border-radius:8px;color:var(--accent);font-weight:600;font-size:.8rem;cursor:pointer;position:relative;overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.pp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;z-index:50}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:78%;border-radius:12px;background:#fff}
.lb span{color:#fff;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:20px 8px}

input[type=email],input[type=password]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:10px}
textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
select{padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
main[hidden],.screen[hidden],.badge[hidden]{display:none}
.screen{max-width:420px;margin:0 auto;padding:8vh 16px 40px}
.gbtn{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);margin-bottom:14px}
.msg{font-size:.85rem;min-height:1.3em;margin:6px 0 10px;color:var(--bad)}
.msg.ok{color:var(--accent)}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.who{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text)}
#team{order:6}
.urow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow small{display:block;color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 10px}
#suggestions .row{cursor:pointer}#suggestions .row:hover{background:var(--soft)}.historyline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.historyline:last-child{border-bottom:0}.chartbox{width:100%;overflow:hidden;margin:10px 0}.chartbox svg{width:100%;height:auto;display:block}
</style>
</head>
<body>

<div class="screen" id="setup" hidden>
  <h1>Almost ready</h1>
  <p class="sub">The Firebase settings are not filled in yet. Open <b>index.html</b>, find <b>firebaseConfig</b> near the top of the script, and paste your own values there (see SETUP.md).</p>
</div>

<div class="screen" id="loading"><p class="sub">Loading…</p></div>

<div class="screen" id="login" hidden>
  <h1>Oparanno Trading</h1>
  <p class="sub">Staff sign in</p>
  <button type="button" class="gbtn" id="gsign">Continue with Google</button>

    <input type="email" id="em" placeholder="Email" required autocomplete="email">
    <input type="password" id="pw" placeholder="Password (at least 6 characters)" required minlength="6" autocomplete="current-password">
    <div style="display:flex;gap:
